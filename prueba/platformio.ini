; Mi placa: ESP32-S3 con pantalla 2,8" (LCDWiki ES3C28P)
[env:placa]
; La plataforma: herramientas de Espressif con Arduino 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; Una placa genérica de ESP32-S3 (la nuestra es compatible)
board = esp32-s3-devkitc-1
framework = arduino

; La memoria: 16 MB de flash y 8 MB de PSRAM de tipo "OPI"
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  ; El USB de la placa es el propio chip: que Serial salga por ahí
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 921600