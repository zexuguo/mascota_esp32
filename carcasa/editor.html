<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marco ES3C28P</title>
<style>
/* Layout: panel de medidas a la izquierda, visor 3D ocupando el resto */
:root {
  --bg: #f3f1ee; --panel: #ffffff; --fg: #1f1b17; --muted: #6f665d;
  --line: #e2ddd6; --accent: #d9682b; --pieza: #e8833a; --placa: #2f7d6b;
  --font: "Inter", system-ui, sans-serif; --mono: ui-monospace, "JetBrains Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17191c; --panel: #1f2226; --fg: #ece8e3; --muted: #9b948c;
          --line: #2f3338; --accent: #f08a4b; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font);
       display: grid; grid-template-columns: 320px 1fr; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 20px;
        overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-size: 18px; margin: 0; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
.grupo { display: flex; flex-direction: column; gap: 12px; }
.grupo h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.campo label { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
.campo small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.fila { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.fila input[type=range] { flex: 1; accent-color: var(--accent); }
.fila input[type=number] { width: 70px; font: 13px var(--mono); padding: 3px 6px;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
.medidas { font: 13px var(--mono); background: var(--bg); border-radius: 8px; padding: 10px 12px;
           font-variant-numeric: tabular-nums; }
.botones { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 600 14px var(--font); padding: 9px 14px; border-radius: 8px; cursor: pointer;
         border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
button.principal { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 8px; align-items: center; }
main { position: relative; min-width: 0; }
#visor { width: 100%; height: 100%; display: block; }
#estado { position: absolute; left: 16px; bottom: 14px; color: var(--muted); font-size: 12px; }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
  main { order: -1; }
}
</style>
</head>
<body>
<aside>
  <div>
    <h1>Marco para la placa</h1>
    <p class="sub">Mueve los valores y la pieza se actualiza. Arrastra para girarla, rueda para acercar.</p>
  </div>

  <div class="grupo" id="campos"></div>

  <label class="check"><input type="checkbox" id="conNFC" checked> Puente para la pegatina NFC</label>
  <label class="check"><input type="checkbox" id="verPlaca" checked> Ver la placa dentro (verde)</label>

  <div class="medidas" id="medidas"></div>

  <div class="botones">
    <button class="principal" id="bajar">Descargar STL</button>
    <button id="reset">Valores iniciales</button>
  </div>
</aside>
<main>
  <canvas id="visor"></canvas>
  <div id="estado">Cargando el motor 3D…</div>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import Module from "https://cdn.jsdelivr.net/npm/manifold-3d@3.2.1/manifold.js";

// ---- parámetros (mismos que marco.py) ----
const DEF = [
  ["LARGO",   "Largo de la placa",  85,  60, 120, 0.5, "mm"],
  ["ANCHO",   "Ancho de la placa",  50,  30,  80, 0.5, "mm"],
  ["GROSOR",  "Grosor de la placa", 15,   5,  30, 0.5, "De la cara de la pantalla a lo más alto de detrás"],
  ["HOLGURA", "Holgura",           0.4,   0,   1, 0.05, "Aire por lado. Flojo → menos; no entra → más"],
  ["PARED",   "Pared",               2,   1,   4, 0.1, "Grosor de los lados"],
  ["LABIO",   "Labio",             1.5, 0.5,   5, 0.1, "Cuánto pisa el borde de la placa"],
  ["T_LABIO", "Grosor del labio",  1.6, 0.8,   3, 0.1, "Lo que sobresale delante y detrás"],
  ["ESQUINA", "Largo de esquina",   12,   5,  40, 0.5, "Más largo = protege más, se ve menos"],
  ["RADIO",   "Redondeo",            3,   0,   6, 0.5, "Curva de las esquinas por fuera"],
  ["NFC_D",   "Pegatina NFC",       20,  10,  40, 0.5, "Diámetro de la pegatina (puente por detrás)"],
];
const p = {};
const cont = document.getElementById("campos");
for (const [k, nombre, v, min, max, step, ayuda] of DEF) {
  p[k] = v;
  const d = document.createElement("div");
  d.className = "campo";
  d.innerHTML = `<label for="r-${k}">${nombre}</label>
    ${ayuda !== "mm" ? `<small>${ayuda}</small>` : ""}
    <div class="fila"><input type="range" id="r-${k}" min="${min}" max="${max}" step="${step}" value="${v}">
    <input type="number" id="n-${k}" min="${min}" max="${max}" step="${step}" value="${v}"></div>`;
  cont.append(d);
  const r = d.querySelector("input[type=range]"), n = d.querySelector("input[type=number]");
  r.oninput = () => { n.value = r.value; p[k] = +r.value; programar(); };
  n.oninput = () => { if (n.value === "") return; r.value = n.value; p[k] = +n.value; programar(); };
}

// ---- escena ----
const canvas = document.getElementById("visor");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(35, 1, 1, 2000);
cam.up.set(0, 0, 1);
cam.position.set(110, -150, 120);
const ctl = new OrbitControls(cam, canvas);
ctl.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.6));
const sol = new THREE.DirectionalLight(0xffffff, 1.8); sol.position.set(80, -60, 150); scene.add(sol);
const sol2 = new THREE.DirectionalLight(0xffffff, 0.7); sol2.position.set(-80, 60, -100); scene.add(sol2);
const rejilla = new THREE.GridHelper(200, 20, 0x888888, 0x888888);
rejilla.rotation.x = Math.PI / 2; rejilla.material.opacity = 0.18; rejilla.material.transparent = true;
scene.add(rejilla);

const css = getComputedStyle(document.documentElement);
const matPieza = new THREE.MeshStandardMaterial({ color: css.getPropertyValue("--pieza").trim(), roughness: 0.55, metalness: 0.05 });
const matPlaca = new THREE.MeshStandardMaterial({ color: css.getPropertyValue("--placa").trim(), transparent: true, opacity: 0.35 });
let pieza = null, placa = null, ultimaMalla = null;

function tam() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  cam.aspect = r.width / r.height; cam.updateProjectionMatrix();
}
addEventListener("resize", tam); tam();
(function bucle() { requestAnimationFrame(bucle); ctl.update(); renderer.render(scene, cam); })();

// ---- geometría ----
const estado = document.getElementById("estado");
let M;
try {
  M = await Module(); M.setup();
  estado.textContent = "";
} catch (e) {
  estado.textContent = "No se pudo cargar el motor 3D (¿sin internet?).";
  throw e;
}
const { Manifold, CrossSection } = M;

function rect(x, y, r) {
  const base = CrossSection.square([Math.max(x - 2 * r, 0.01), Math.max(y - 2 * r, 0.01)], true);
  if (r <= 0) return base;
  const o = base.offset(r, "Round", 2, 48); base.delete(); return o;
}

function construir() {
  const iL = p.LARGO + 2 * p.HOLGURA, iW = p.ANCHO + 2 * p.HOLGURA;
  const oL = iL + 2 * p.PARED, oW = iW + 2 * p.PARED;
  const H = (p.GROSOR + p.HOLGURA) + 2 * p.T_LABIO;
  const basura = [];
  const g = x => (basura.push(x), x);

  const caja = g(g(rect(oL, oW, Math.min(p.RADIO, oW / 2 - 0.1))).extrude(H));
  const hueco = g(g(g(rect(iL, iW, 0.6)).extrude(p.GROSOR + p.HOLGURA)).translate([0, 0, p.T_LABIO]));
  const ventana = g(g(g(rect(iL - 2 * p.LABIO, iW - 2 * p.LABIO, 2)).extrude(H + 2)).translate([0, 0, -1]));
  let marco = g(g(caja.subtract(hueco)).subtract(ventana));

  const z0 = p.T_LABIO, alto = H - z0 + 1;
  const lh = oL - 2 * p.ESQUINA, ah = oW - 2 * p.ESQUINA;
  if (lh > 0) marco = g(marco.subtract(g(g(Manifold.cube([lh, oW + 2, alto])).translate([-lh / 2, -oW / 2 - 1, z0]))));
  if (ah > 0) marco = g(marco.subtract(g(g(Manifold.cube([oL + 2, ah, alto])).translate([-oL / 2 - 1, -ah / 2, z0]))));

  if (document.getElementById("conNFC").checked) {
    const banda = p.NFC_D + 4, x0 = oL / 2 - banda;
    const zona = g(g(Manifold.cube([banda, oW + 2, H + 2])).translate([x0, -oW / 2 - 1, -1]));
    const vf = g(g(g(rect(iL - 2 * p.LABIO, iW - 2 * p.LABIO, 2)).extrude(p.T_LABIO + 1)).translate([0, 0, -1]));
    let tramo = g(g(g(caja.subtract(hueco)).subtract(vf)).intersect(zona));
    const aw = Math.max(ah, 0.1);
    tramo = g(tramo.subtract(g(g(Manifold.cube([p.PARED + 2, aw, H - 2 * p.T_LABIO])).translate([oL / 2 - p.PARED - 1, -aw / 2, p.T_LABIO]))));
    const reb = g(g(Manifold.cylinder(1.4, (p.NFC_D + 0.5) / 2, (p.NFC_D + 0.5) / 2, 96)).translate([oL / 2 - banda / 2, 0, H - 0.4]));
    marco = g(g(marco.add(tramo)).subtract(reb));
  }

  const mesh = marco.getMesh();
  for (const b of basura) try { b.delete(); } catch {}

  const np = mesh.numProp, vp = mesh.vertProperties, tv = mesh.triVerts;
  const pos = new Float32Array(tv.length * 3);
  for (let i = 0; i < tv.length; i++) for (let j = 0; j < 3; j++) pos[i * 3 + j] = vp[tv[i] * np + j];
  ultimaMalla = pos;

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  if (pieza) { scene.remove(pieza); pieza.geometry.dispose(); }
  pieza = new THREE.Mesh(geo, matPieza); scene.add(pieza);

  if (placa) { scene.remove(placa); placa.geometry.dispose(); }
  placa = new THREE.Mesh(new THREE.BoxGeometry(p.LARGO, p.ANCHO, p.GROSOR), matPlaca);
  placa.position.z = p.T_LABIO + p.HOLGURA / 2 + p.GROSOR / 2;
  placa.visible = document.getElementById("verPlaca").checked;
  scene.add(placa);
  ctl.target.set(0, 0, H / 2);

  const vol = Math.abs(volumen(pos)) / 1000;
  document.getElementById("medidas").innerHTML =
    `Exterior: ${oL.toFixed(1)} × ${oW.toFixed(1)} × ${H.toFixed(1)} mm<br>` +
    `Hueco:    ${iL.toFixed(1)} × ${iW.toFixed(1)} × ${(p.GROSOR + p.HOLGURA).toFixed(1)} mm<br>` +
    `Plástico: ${vol.toFixed(1)} cm³ ≈ ${(vol * 1.24).toFixed(0)} g de PLA`;
}
function volumen(pos) {
  let v = 0;
  for (let i = 0; i < pos.length; i += 9) {
    const [a, b, c, d, e, f, g, h, k] = pos.subarray(i, i + 9);
    v += a * (e * k - f * h) - b * (d * k - f * g) + c * (d * h - e * g);
  }
  return v / 6;
}
let t;
function programar() { clearTimeout(t); t = setTimeout(construir, 60); }
construir();

document.getElementById("conNFC").onchange = construir;
document.getElementById("verPlaca").onchange = e => { if (placa) placa.visible = e.target.checked; };
document.getElementById("reset").onclick = () => {
  for (const [k, , v] of DEF) { p[k] = v; document.getElementById("r-" + k).value = v; document.getElementById("n-" + k).value = v; }
  construir();
};
document.getElementById("bajar").onclick = () => {
  const pos = ultimaMalla, n = pos.length / 9;
  const buf = new ArrayBuffer(84 + n * 50), dv = new DataView(buf);
  dv.setUint32(80, n, true);
  for (let i = 0; i < n; i++) {
    const o = 84 + i * 50, q = pos.subarray(i * 9, i * 9 + 9);
    const ux = q[3] - q[0], uy = q[4] - q[1], uz = q[5] - q[2], vx = q[6] - q[0], vy = q[7] - q[1], vz = q[8] - q[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const l = Math.hypot(nx, ny, nz) || 1;
    dv.setFloat32(o, nx / l, true); dv.setFloat32(o + 4, ny / l, true); dv.setFloat32(o + 8, nz / l, true);
    for (let j = 0; j < 9; j++) dv.setFloat32(o + 12 + j * 4, q[j], true);
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], { type: "model/stl" }));
  a.download = `marco_${p.LARGO}x${p.ANCHO}x${p.GROSOR}.stl`;
  a.click();
};
</script>
</body>
</html>
